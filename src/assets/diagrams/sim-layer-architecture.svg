<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">実務への応用：変化に強いハーネスの4層分離と改善の記憶</title>
  <desc id="desc">論文Table 8をもとにハーネスを4層に分ける実務設計モデル。下層から基盤・フック層（そのまま再利用）、調整パラメータ層（モデル別に再校正）、判定ルール・ルーブリック層（条件を差し替え）、環境依存ワークアラウンド層（移行時に棚卸し・撤去候補）と積み上げ、右横に全層を貫く改善の記憶SIM（ADRとEvalログ）を紐づける。</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="800" height="620" rx="16" fill="#f8fafc"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" fill="#0f172a">
    <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700">実務への応用：変化に強いハーネスの4層分離と「改善の記憶」</text>
    <text x="400" y="62" text-anchor="middle" font-size="14" fill="#475569">論文 Table 8 をもとに、モデル・タスク移行時の再利用性でハーネスを4層に分けて整理</text>

    <!-- Layer 4: Setting-dependent -->
    <rect x="24" y="82" width="510" height="102" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="40" y="110" font-size="15.5" font-weight="700" fill="#991b1b">層4：環境依存ワークアラウンド</text>
    <rect x="330" y="90" width="190" height="26" rx="13" fill="#fee2e2" stroke="#ef4444"/>
    <text x="425" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">移行時に棚卸し・撤去</text>
    <text x="40" y="140" font-size="14" fill="#334155">例：特定モデル向けJSON修復、データ固有正規化</text>
    <text x="40" y="166" font-size="14" fill="#7f1d1d">設計：期限付き対策としてタグ付けし移行時に見直す</text>

    <!-- Layer 3: Rules / Rubrics -->
    <rect x="24" y="196" width="510" height="102" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="40" y="224" font-size="15.5" font-weight="700" fill="#92400e">層3：判定ルール・ルーブリック</text>
    <rect x="330" y="204" width="190" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="425" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">骨格を残し条件差替え</text>
    <text x="40" y="254" font-size="14" fill="#334155">例：完了判定の条件（実行→最適性）、評価基準</text>
    <text x="40" y="280" font-size="14" fill="#78350f">設計：「検査箇所（骨格）」と「合格条件」を分離</text>

    <!-- Layer 2: Tunable Thresholds & Detection Logic -->
    <rect x="24" y="310" width="510" height="102" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="40" y="338" font-size="15.5" font-weight="700" fill="#1e3a8a">層2：環境適応・パラメータ層</text>
    <rect x="330" y="318" width="190" height="26" rx="13" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="425" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">閾値や検知法を再調整</text>
    <text x="40" y="368" font-size="14" fill="#334155">例：top-k・介入トリガー・ペースト制御・履歴監視</text>
    <text x="40" y="394" font-size="14" fill="#1e40af">設計：定数や検知手段を外出しし移行時に再校正</text>

    <!-- Layer 1: Stable Core -->
    <rect x="24" y="424" width="510" height="102" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="40" y="452" font-size="15.5" font-weight="700" fill="#065f46">層1：基盤・フック層（安定IF）</text>
    <rect x="330" y="432" width="190" height="26" rx="13" fill="#d1fae5" stroke="#10b981"/>
    <text x="425" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">そのまま再利用しやすい</text>
    <text x="40" y="482" font-size="14" fill="#334155">例：シェル実行・BM25検索・フック・ゲート挿入点</text>
    <text x="40" y="508" font-size="14" fill="#064e3b">設計：モデル固有処理を混ぜず共通基盤として保守</text>

    <!-- Connecting dashed arrows from SIM pillar to each layer -->
    <path d="M562 133H541" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
    <path d="M562 247H541" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
    <path d="M562 361H541" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>
    <path d="M562 475H541" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-teal)"/>

    <!-- Right Vertical Pillar: SIM / ADR + Eval Log -->
    <rect x="562" y="82" width="214" height="444" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="669" y="112" text-anchor="middle" font-size="16.5" font-weight="700" fill="#134e4a">改善の記憶（SIM）</text>
    <text x="669" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">ADR ＋ Eval判断ログ</text>

    <rect x="576" y="152" width="186" height="82" rx="8" fill="#ffffff" stroke="#5eead4"/>
    <text x="669" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#115e59">1. Root Cause</text>
    <text x="669" y="200" text-anchor="middle" font-size="14" fill="#334155">どの失敗モードへの</text>
    <text x="669" y="220" text-anchor="middle" font-size="14" fill="#334155">変更かを明記</text>

    <rect x="576" y="244" width="186" height="82" rx="8" fill="#ffffff" stroke="#5eead4"/>
    <text x="669" y="268" text-anchor="middle" font-size="14.5" font-weight="700" fill="#115e59">2. Rationale &amp; Diff</text>
    <text x="669" y="292" text-anchor="middle" font-size="14" fill="#334155">なぜこの層・実装に</text>
    <text x="669" y="312" text-anchor="middle" font-size="14" fill="#334155">したかの根拠を記録</text>

    <rect x="576" y="336" width="186" height="90" rx="8" fill="#ffffff" stroke="#5eead4"/>
    <text x="669" y="360" text-anchor="middle" font-size="14.5" font-weight="700" fill="#115e59">3. 予測と実測</text>
    <text x="669" y="384" text-anchor="middle" font-size="14" fill="#334155">直った件数と外した</text>
    <text x="669" y="406" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">件数（撤回も保持）</text>

    <rect x="576" y="436" width="186" height="78" rx="8" fill="#ffffff" stroke="#5eead4"/>
    <text x="669" y="460" text-anchor="middle" font-size="14.5" font-weight="700" fill="#115e59">4. Provenance</text>
    <text x="669" y="484" text-anchor="middle" font-size="14" fill="#334155">確認したモデル版と</text>
    <text x="669" y="504" text-anchor="middle" font-size="14" fill="#334155">評価セットを紐づけ</text>

    <!-- Footer caption -->
    <rect x="24" y="544" width="752" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="400" y="568" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">下層ほど環境変化をまたいで再利用しやすく、上層ほど移行時の再検証が要る。</text>
    <text x="400" y="590" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">右側の記憶（SIM）が全層の変更判断を支える。</text>
  </g>
</svg>
