<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="title desc">
  <title id="title">論文の全体像：環境が変わったとき、なぜ「コードだけ」では足りないのか</title>
  <desc id="desc">ソース環境では初期のシードハーネスH_0からRSIで進化済みハーネスH_Sと改善の記憶SIMを得る。モデル変更やタスク変化後のターゲット環境では、Cold Startはゼロからやり直し、Harness TransferはコードH_Sのみ渡して負の転移や手戻りを起こしやすいのに対し、CRSI+Full SIMはコードと記憶をセットで渡すことで負の転移を逆転し最高スコアを達成する。</desc>
  <defs>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#475569"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#b45309"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="800" height="660" rx="16" fill="#f8fafc"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" fill="#0f172a">
    <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700">論文の全体像：環境が変わったとき、なぜ「コードだけ」では足りないのか</text>

    <!-- Phase 1: Source RSI -->
    <rect x="24" y="54" width="752" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="42" y="78" font-size="14.5" font-weight="700" fill="#475569">フェーズ1：ソース環境でのRSI（例：Workspaceを Claude Opus 5.5 で進化）</text>

    <!-- Seed Harness H_0 -->
    <rect x="42" y="92" width="196" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="120" text-anchor="middle" font-size="15.5" font-weight="700">シードハーネス (H_0)</text>
    <text x="140" y="144" text-anchor="middle" font-size="14" fill="#475569">RSI前の最小・標準構成</text>

    <!-- Arrow H_0 -> H_S -->
    <path d="M238 128H318" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <text x="278" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">RSI進化</text>

    <!-- Evolved Harness H_S -->
    <rect x="324" y="92" width="202" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="425" y="120" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e3a8a">進化済みハーネス (H_S)</text>
    <text x="425" y="144" text-anchor="middle" font-size="14" fill="#1e40af">ソース向けの改修コード</text>

    <text x="540" y="135" text-anchor="middle" font-size="22" font-weight="700" fill="#0f766e">＋</text>

    <!-- SIM M_S -->
    <rect x="554" y="92" width="206" height="72" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="657" y="120" text-anchor="middle" font-size="15.5" font-weight="700" fill="#134e4a">改善の記憶 (SIM / M_S)</text>
    <text x="657" y="144" text-anchor="middle" font-size="14" fill="#115e59">原因・根拠・予測と実測</text>

    <!-- Transition pill -->
    <path d="M400 180V226" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <rect x="90" y="188" width="620" height="28" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="400" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">片側の環境変化：モデル変更（課題固定） または データ変更（モデル固定）</text>

    <!-- Phase 2 Container -->
    <text x="28" y="250" font-size="14.5" font-weight="700" fill="#475569">フェーズ2：ターゲット環境での3つの進め方（例：Opus 5.5 → Gemini 3.8 Flash / Workspace）</text>

    <!-- Row 1: Cold Start -->
    <rect x="24" y="264" width="752" height="118" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="40" y="278" width="200" height="90" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="140" y="306" text-anchor="middle" font-size="16" font-weight="700">1. Cold Start</text>
    <text x="140" y="330" text-anchor="middle" font-size="14" fill="#334155">H_0 からやり直し</text>
    <text x="140" y="352" text-anchor="middle" font-size="14" fill="#64748b">（過去の資産は捨てる）</text>
    <path d="M240 323H266" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <text x="278" y="294" font-size="15" font-weight="700" fill="#0f172a">初期シード H_0 からゼロベースで最適化</text>
    <text x="278" y="322" font-size="14" fill="#334155">・過去の偏りはないが、有用な工夫も毎回ゼロから再発見が必要</text>
    <text x="278" y="350" font-size="14" font-weight="600" fill="#475569">・Workspace実測：シード 73.89 → 10ラウンド後 82.98</text>

    <!-- Row 2: Harness Transfer -->
    <rect x="24" y="394" width="752" height="122" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <rect x="40" y="408" width="200" height="94" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="140" y="436" text-anchor="middle" font-size="15.5" font-weight="700" fill="#78350f">2. Harness Transfer</text>
    <text x="140" y="460" text-anchor="middle" font-size="14" fill="#92400e">コード H_S のみ引き継ぎ</text>
    <text x="140" y="484" text-anchor="middle" font-size="14" fill="#b45309">（SIMなし）</text>
    <path d="M240 455H266" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <text x="278" y="424" font-size="14.5" font-weight="700" fill="#92400e">「なぜ変えたか」が消えたコードだけ渡す → 手戻り・自爆が起きやすい</text>
    <text x="278" y="454" font-size="14" fill="#334155">・転移直後に負の転移（68.41 &lt; シード 73.89）。既存ガードを誤改修</text>
    <text x="278" y="484" font-size="14" font-weight="700" fill="#b91c1c">・Workspace実測：68.41 → 10ラウンド後 73.42（Cold Start未満）</text>

    <!-- Row 3: CRSI + Full SIM -->
    <rect x="24" y="528" width="752" height="118" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <rect x="40" y="542" width="200" height="90" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="140" y="568" text-anchor="middle" font-size="15.5" font-weight="700" fill="#134e4a">3. CRSI ＋ Full SIM</text>
    <text x="140" y="592" text-anchor="middle" font-size="14" fill="#115e59">コード H_S ＋ 記憶 SIM</text>
    <text x="140" y="616" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">（提案手法）</text>
    <path d="M240 587H266" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
    <text x="278" y="558" font-size="14.5" font-weight="700" fill="#134e4a">意図と検証結果を踏まえて「維持・修正・撤去」を根拠付きで判断</text>
    <text x="278" y="586" font-size="14" fill="#334155">・負の転移からでも既存資産を活かして適応し、新記録もSIMへ追記</text>
    <text x="278" y="614" font-size="14" font-weight="700" fill="#0f766e">・Workspace実測：68.41 → 10ラウンド後 84.75（SIMなし比 +11.33pt）</text>
  </g>
</svg>
